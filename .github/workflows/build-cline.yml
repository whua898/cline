name: Build Cline Plugin

on:
  workflow_dispatch:  # 手动触发
  push:
    branches: [ fix-protobus-* ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Plugin
        working-directory: ./intellij-plugin
        run: ./gradlew buildPlugin --no-daemon

      - name: Extract cline-core.js
        run: |
          cd intellij-plugin/build/distributions
          unzip -q *.zip
          cd cline-*/lib
          unzip -q cline-*.jar standalone.zip -d /tmp/
          unzip -q /tmp/standalone.zip -d /tmp/cline-runtime/
          ls -la /tmp/cline-runtime/cline-core.js

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cline-runtime
          path: |
            intellij-plugin/build/distributions/*.zip
            /tmp/cline-runtime/cline-core.js
          retention-days: 7
